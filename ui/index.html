<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Skillmesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Share+Tech+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style nonce="__NONCE__">
:root{
  --paper:#f2f8fa;--panel:#fff;--panel2:#e8f2f6;--ink:#0e2a38;--muted:#4b6472;--line:#c9dde5;--line2:#9cc4d3;
  --acc:#0a8fa3;--acc-ink:#fff;--mesh:#007c8e;--sig:#e8492b;--sig-ink:#fff;--sig-soft:#ffe3dc;
  --ok:#1b7f55;--ok-soft:#dcf3e8;--warn:#a36200;--warn-soft:#fbeccd;--bad:#c2321b;--bad-soft:#fde0da;--dim:#6b8290;--dim-soft:#e4ecf0;
  --shadow:0 1px 2px rgba(14,42,56,.06),0 8px 24px rgba(14,42,56,.07);--scrim:rgba(14,42,56,.38);
  --f-name:'Oxanium',system-ui,sans-serif;--f-mono:'Share Tech Mono',ui-monospace,Consolas,monospace;--f-text:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#071720;--panel:#0d2430;--panel2:#11303e;--ink:#e6f5f8;--muted:#9fbac4;--line:#1d4152;--line2:#2c6075;
  --acc:#3ee0f0;--acc-ink:#04212a;--mesh:#3ee0f0;--sig:#ff7a5c;--sig-ink:#2a0d06;--sig-soft:#3a1d16;
  --ok:#5fd6a0;--ok-soft:#0f3426;--warn:#f0b44a;--warn-soft:#3a2a0c;--bad:#ff8a73;--bad-soft:#3d1a14;--dim:#86a3ae;--dim-soft:#16323e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  --paper:#071720;--panel:#0d2430;--panel2:#11303e;--ink:#e6f5f8;--muted:#9fbac4;--line:#1d4152;--line2:#2c6075;
  --acc:#3ee0f0;--acc-ink:#04212a;--mesh:#3ee0f0;--sig:#ff7a5c;--sig-ink:#2a0d06;--sig-soft:#3a1d16;
  --ok:#5fd6a0;--ok-soft:#0f3426;--warn:#f0b44a;--warn-soft:#3a2a0c;--bad:#ff8a73;--bad-soft:#3d1a14;--dim:#86a3ae;--dim-soft:#16323e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.55);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-text)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sprite{position:absolute;width:0;height:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--panel);padding:8px 12px;border-radius:8px;z-index:20;border:1px solid var(--line2)}
.skip:focus{left:8px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh;min-height:520px;position:relative;overflow:hidden}
main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto}
main.sr{overflow:hidden}
.mono{font-family:var(--f-mono)}
.g{width:18px;height:18px;flex:none;display:inline-block}.g svg{width:100%;height:100%;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:600 14px var(--f-text);white-space:nowrap;transition:transform .12s,border-color .12s,background .12s}
.btn:hover:not([disabled]){border-color:var(--acc)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sig{background:var(--sig);border-color:var(--sig);color:var(--sig-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kbd{font:12px var(--f-mono);padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:12px var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-warn{background:var(--warn-soft);color:var(--warn)}.s-bad{background:var(--bad-soft);color:var(--bad)}.s-dim{background:var(--dim-soft);color:var(--dim)}.s-sig{background:var(--sig-soft);color:var(--sig)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.grid-bg{background-image:radial-gradient(circle,var(--line2) 1.2px,transparent 1.3px);background-size:24px 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.m{font:12.5px var(--f-mono);color:var(--muted)}
code{font:12.5px var(--f-mono);background:var(--panel2);padding:1px 6px;border-radius:5px;word-break:break-all}
/* agent logo tile */
.lt{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--panel2);flex:none;color:var(--ink)}
.lt svg{width:20px;height:20px}
.lt.kiro{background:#9046ff}
.lt.sm{width:24px;height:24px;border-radius:7px}.lt.sm svg{width:15px;height:15px}
.lt.lg{width:44px;height:44px;border-radius:12px}.lt.lg svg{width:26px;height:26px}
.lt.let{font:800 11px var(--f-name);letter-spacing:.02em;box-shadow:inset 0 0 0 1.5px var(--line2)}
.lt.sm.let{font-size:9.5px}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand .mk{width:30px;height:28px;color:var(--ink);flex:none}.brand .mk svg{width:100%;height:100%}
.name{font-family:var(--f-name);font-weight:800;letter-spacing:.06em;font-size:18px}.name b{color:var(--mesh)}
.rs{height:44px;justify-content:flex-start;margin:0 0 14px;border-radius:12px;width:100%}
.rs .kbd{margin-left:auto;color:inherit;border-color:currentColor}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--muted);font-weight:500;position:relative}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--panel2);color:var(--ink)}
.nav.dis{opacity:.4;pointer-events:none}
.nav .n{margin-left:auto;font:12px var(--f-mono);color:var(--sig)}
.rail .sp{flex:1}
.rail .lab{font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.srv{border:1px solid var(--line);border-radius:12px;padding:12px;font:12px var(--f-mono);color:var(--muted);display:grid;gap:6px;word-break:break-all}
.srv .row{display:flex;align-items:center;gap:8px}.srv .dot{color:var(--ok)}
.srv.off{border-color:var(--bad);color:var(--bad)}.srv.off .dot{color:var(--bad)}
/* page header */
.ph{display:flex;align-items:center;gap:12px;padding:20px 28px 0;flex:none;flex-wrap:wrap}
.ph h1{font:800 24px var(--f-name);letter-spacing:.04em}
.ph p{margin-top:3px;color:var(--muted);font:12.5px var(--f-mono)}
.ph .sp,.sp{flex:1}
.pb{flex:1;padding:18px 28px 24px;display:grid;gap:16px;align-content:start;min-height:0}
/* banners */
.ban{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px solid;font-size:13.5px;flex:none}
.ban b{font-weight:600}
.ban.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}.ban.bad>.g{color:var(--bad)}
.ban.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}.ban.ok>.g{color:var(--ok)}
.ban.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.ban.warn>.g{color:var(--warn)}
.ban.info{background:var(--panel2);border-color:var(--line)}.ban.info>.g{color:var(--mesh)}
/* cards */
.cards{display:grid;gap:14px}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.cd h3{font:700 16px var(--f-name);letter-spacing:.03em;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cd p{color:var(--muted);font-size:13px}
.ic{width:36px;height:36px;border-radius:10px;background:var(--panel2);color:var(--mesh);display:inline-grid;place-items:center;flex:none}
.ic.ok{background:var(--ok-soft);color:var(--ok)}.ic.bad{background:var(--bad-soft);color:var(--bad)}.ic.warn{background:var(--warn-soft);color:var(--warn)}
.ln{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;min-width:0}
.ln:last-child{border-bottom:0}
.ln .m{min-width:0;overflow:hidden;text-overflow:ellipsis}
.oh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.oh h2{font:700 16px var(--f-name);letter-spacing:.03em}
.k{display:inline-block;font:11px var(--f-mono);padding:0 7px;height:20px;line-height:20px;border-radius:6px;letter-spacing:.03em;white-space:nowrap}
.tick{width:18px;height:18px;border-radius:5px;border:2px solid var(--line2);display:inline-grid;place-items:center;flex:none;background:transparent;padding:0;color:#fff}
.tick.on{background:var(--sig);border-color:var(--sig);color:var(--sig-ink)}.tick .g{width:12px;height:12px}
/* segmented, chips */
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:0;background:transparent;font:600 13px var(--f-text);color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .g{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font:12px var(--f-mono);background:var(--panel);white-space:nowrap}
.chip.on{border-color:var(--ink)}
button.chip:hover{border-color:var(--acc)}
/* status strip */
.strip{position:relative;display:flex;align-items:center;height:116px;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow:hidden}
.strip .grid-bg{position:absolute;inset:0;opacity:.45}
.strip .core{position:relative;width:80px;height:80px;border-radius:50%;border:3px solid var(--acc);background:var(--panel);display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--line);margin-right:22px}
.strip .core .bot{width:40px;height:38px;color:var(--ink)}.bot svg{width:100%;height:100%;display:block}
.strip .cap{position:absolute;left:132px;top:12px;font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.strip .bus{position:relative;flex:1;display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;padding:4px 2px}
.strip .bus:before{content:"";position:absolute;left:-14px;right:0;top:50%;height:3px;background:var(--acc);border-radius:2px}
.strip .bus>*{flex:none}
.strip .nd{position:relative;display:flex;align-items:center;gap:8px;height:50px;padding:0 10px 0 8px;border-radius:999px;background:var(--panel);border:2px solid var(--line2)}
.strip .nd b{font:700 14px var(--f-name);letter-spacing:.03em;white-space:nowrap}
.strip button.nd:hover{border-color:var(--acc)}
.strip .nd.warn{border-color:var(--warn)}.strip .nd.bad{border-color:var(--bad)}
.strip .okc{position:relative;display:flex;align-items:center;gap:8px;height:50px;padding:0 12px 0 10px;border-radius:999px;background:var(--panel);border:2px solid var(--ok)}
.strip .okc .stack{display:flex}.strip .okc .stack .lt{margin-left:-8px;box-shadow:0 0 0 2px var(--panel)}.strip .okc .stack .lt:first-child{margin-left:0}
.strip .okc b{font:700 14px var(--f-name);color:var(--ok);white-space:nowrap}
.strip.scan .bus:before{background:repeating-linear-gradient(90deg,var(--acc) 0 10px,transparent 10px 18px)}
.strip.scan .nd{height:42px;padding:0 8px;border-style:dashed;opacity:.6;animation:pulse 1.4s ease-in-out infinite}
.strip.compact .nd b{display:none}
@keyframes pulse{50%{opacity:.95}}
/* scan result body */
.body{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;flex:1;position:relative}
.left{padding:16px 24px;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.tools h1{margin:0 8px 0 0;font:800 22px var(--f-name);letter-spacing:.04em;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;font:12.5px var(--f-mono);color:var(--muted)}.prog .g{color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tbl,.mx{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rows{overflow:auto;min-height:0;flex:1 1 auto}
.tr{display:grid;align-items:center;gap:12px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line);font-size:14px;grid-template-columns:28px 128px minmax(0,1fr) 150px;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;color:inherit}
div.tr.h{position:sticky;top:0;z-index:1;min-height:36px;font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
.tr b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .a{display:flex;align-items:center;gap:8px;font:13px var(--f-mono);min-width:0}
.tr .a span:last-child{overflow:hidden;text-overflow:ellipsis}
.tr[data-k]{cursor:pointer}.tr[data-k]:hover{background:color-mix(in srgb,var(--acc) 5%,transparent)}
.rowb{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.cur,.mr.cur{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.foot{display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:13px;color:var(--muted);flex:none;border-top:1px solid var(--line);flex-wrap:wrap}
.emp{flex:1;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:40px}
.emp .ic{width:64px;height:64px;border-radius:20px}.emp .ic .g{width:30px;height:30px}
.emp h2{margin-top:6px;font:800 22px var(--f-name);letter-spacing:.03em}
.emp p{color:var(--muted);max-width:420px}
.skr{display:grid;grid-template-columns:28px 128px minmax(0,1fr) 150px;gap:12px;align-items:center;height:44px;padding:0 16px;border-bottom:1px solid var(--line)}
.sk{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
/* matrix */
.mr{display:grid;grid-template-columns:minmax(120px,1fr) repeat(var(--cols),52px);align-items:center;min-height:38px;padding:0 12px 0 18px;border-bottom:1px solid var(--line);font-size:14px}
.mr b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
div.mr.h{position:sticky;top:0;z-index:1;min-height:62px;background:var(--panel2);align-items:end;padding-bottom:7px}
.mr.h .c{display:grid;justify-items:center;gap:4px;font:10px var(--f-mono);color:var(--muted)}
.mr.h .c .n{max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr.h .lab{font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mr .c{display:grid;place-items:center}
.okd{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--ok) 55%,transparent)}
.fx{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;border:0;padding:0}
.fx .g{width:15px;height:15px}
.fx.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sig)}
.fx.un{opacity:.55;outline:1.5px dashed currentColor;outline-offset:-1.5px}
.mr.fold{color:var(--muted);font:12.5px var(--f-mono);display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 18px}
.mr.tot{min-height:34px;background:var(--panel2);font:12px var(--f-mono);color:var(--muted)}
/* path panel */
.side{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr auto;min-height:0;overflow:auto}
.sh{padding:18px 20px 6px}.sh small{font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sh b{display:block;font:700 18px var(--f-name);letter-spacing:.03em;margin-top:4px;word-break:break-word}
.map{position:relative;margin:6px 20px;height:380px}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.pn{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font:12px var(--f-mono);word-break:break-all}
.pn small{display:block;color:var(--muted);font-size:11px}
.pn.old{border:1.5px dashed var(--bad);color:var(--bad);left:112px}.pn.old small{color:var(--bad)}
.pn.ghost{border-style:dashed;color:var(--muted)}
.pc{position:absolute;left:22px;width:68px;height:68px;border-radius:50%;border:3px solid var(--acc);background:var(--panel);display:grid;place-items:center}
.pc .bot{width:34px;height:32px;color:var(--ink)}
.tag{position:absolute;font:11px var(--f-mono);padding:2px 7px;border-radius:6px;white-space:nowrap}
.sf{padding:14px 20px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.sf .row{display:flex;align-items:flex-start;gap:10px;font-size:13px}.sf .row .g{margin-top:2px}
.sf .btn{justify-content:center;height:40px}
.side .empty{display:grid;justify-items:center;align-content:center;gap:12px;padding:0 36px;text-align:center;color:var(--muted);font-size:13px}
.side .empty .g{width:40px;height:40px;color:var(--line2)}
.drawer-x{display:none;position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:8px;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--panel);z-index:4}
/* overview */
.ovb{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding:18px 28px 24px;min-height:0}
.hub{position:relative;overflow:hidden;min-height:420px}
.hub .grid-bg{position:absolute;inset:0;opacity:.5;border-radius:18px}
.hub>svg{position:absolute;left:0;top:0}
.hub h2{position:absolute;left:22px;top:16px;font:12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);z-index:1}
.hc{position:absolute;width:140px;height:140px;border-radius:50%;background:var(--panel);border:4px solid var(--acc);display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 0 0 9px var(--paper),0 0 0 11px var(--line)}
.hc .bot{width:62px;height:58px;color:var(--ink);margin-top:-22px}
.hc small{position:absolute;bottom:22px;font:11.5px var(--f-mono);color:var(--muted);text-align:center;line-height:1.3}
.an{position:absolute;display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;border-radius:14px;background:var(--panel);border:2px solid var(--ok);transform:translateY(-50%);box-shadow:var(--shadow);text-align:left}
.an.warn{border-color:var(--warn)}.an.bad{border-color:var(--bad)}.an.dim{border-color:var(--line2)}
.an:hover{border-color:var(--acc)}
.an .main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:100%;background:none;border:0;padding:0;text-align:left}
.an .tx{display:grid;min-width:0;flex:1}
.an b{font:700 15px var(--f-name);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an small{font:11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an .pill{flex:none;height:22px;padding:0 7px}
.an.ok .pill{background:none;padding:0;color:var(--ok)}
.an .one{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.an .one:hover{border-color:var(--acc);color:var(--ink)}.an .one .g{width:15px;height:15px}
.hub .legend{position:absolute;left:22px;bottom:14px;display:flex;gap:14px;font:11.5px var(--f-mono);color:var(--muted);flex-wrap:wrap;z-index:1}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:18px;height:3px;border-radius:2px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.col .cd h3 .sp{flex:1}
.big{width:100%;height:52px;justify-content:center;font-size:15px;border-radius:13px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:12.5px;background:none;border:0;padding:0;text-align:left}
.sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:left .15s}
.opt[aria-checked="true"] .sw{background:var(--acc)}.opt[aria-checked="true"] .sw:after{left:17px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.st{padding:0}
.bar{display:none;align-items:center;gap:10px;padding:10px 12px 10px 18px;flex-wrap:wrap}
.bar .lab{font:11.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fr{flex:1;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:28px;padding:22px 28px 28px;min-height:0}
.gbox{position:relative;min-height:300px}
.gbox .hc{left:50%;top:44%}
.gn{position:absolute;width:62px;height:62px;border-radius:16px;border:2px dashed var(--line2);transform:translate(-50%,-50%)}
.steps{display:grid;gap:12px;align-content:start}
.sp4{display:flex;gap:16px;align-items:flex-start}
.sp4 .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-name);background:var(--panel2);color:var(--muted);flex:none}
.sp4.now .no{background:var(--acc);color:var(--acc-ink)}
.sp4 .tx{flex:1;min-width:0}.sp4 .btn{margin-top:12px}
/* log, safety, doctor, link, init */
.two{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;min-height:0}
.runs{overflow-x:hidden;overflow-y:auto;max-height:70vh}
.run>span:nth-child(2){min-width:0}
.run{display:grid;grid-template-columns:44px minmax(0,1fr) auto;min-width:0;gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.run .ic{width:34px;height:34px}
.run b{display:block;font-weight:600;font-size:13.5px}.run small{font:11.5px var(--f-mono);color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run.on{background:var(--panel2)}
.out{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;min-height:260px}
.con{background:var(--panel2);margin:0;padding:16px 18px;font:12.5px/1.75 var(--f-mono);color:var(--ink);white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:62vh}
.con .ok{color:var(--ok)}.con .w{color:var(--warn)}.con .b{color:var(--bad)}.con .mu{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rule{display:flex;gap:14px;align-items:flex-start}.rule h3{margin-bottom:4px}.rule .ic{width:40px;height:40px}
.chk .ln .ic{width:30px;height:30px;border-radius:8px}.chk .ln .ic .g{width:16px;height:16px}.chk .ln b{font-weight:600}
.grp{font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 18px 6px;background:var(--panel2);border-bottom:1px solid var(--line)}
.agpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.agp{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 8px;border-radius:12px;border:2px dashed var(--line2);background:var(--panel);font:700 15px var(--f-name);color:var(--muted)}
.agp[aria-pressed="true"]{border:2px solid var(--acc);color:var(--ink)}
.agp .tick{margin-left:6px}.agp[aria-pressed="true"] .tick{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.mr2{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--cols),150px);align-items:center;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line)}
.mr2.h{min-height:40px;background:var(--panel2);font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mr2.h span{display:flex;align-items:center;gap:8px}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* dialog */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:30;padding:16px}
.scrim.top{background:transparent;place-items:start center;padding-top:150px;pointer-events:none}.scrim.top .dlg{pointer-events:auto}
.dlg{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.dlg .dh{padding:22px 24px 8px}.dlg .dh h2{font:800 21px var(--f-name);letter-spacing:.03em}.dlg .dh p{margin-top:6px;color:var(--muted);font-size:13.5px}
.dlg .df{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);background:var(--panel2);flex:none}
.dl{display:grid;padding:4px 24px 8px;overflow:auto}.dl .ln{padding:10px 0;flex-wrap:wrap}.dl .ln b{font-weight:600}.dl .ln .lt{margin-left:auto}
.note{display:grid;gap:8px;padding:10px 24px 18px;font-size:13px;color:var(--muted)}
.note div{display:flex;gap:10px;align-items:flex-start}.note .g{width:16px;height:16px;color:var(--ok);margin-top:2px}
main.stale .tbl .tr:not(.h){opacity:.5}
.dead main{opacity:.45;filter:grayscale(.7);pointer-events:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font:13px var(--f-text);z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* narrow window: the rail folds to icons, the path panel becomes a drawer */
@media (max-width:1199px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .rail{padding:16px 10px;align-items:center}
  .brand{padding:2px 0 18px}.brand .name{display:none}
  .nav{width:44px;padding:0;justify-content:center}.nav .t{display:none}
  .nav .n{position:absolute;right:-2px;top:2px;margin:0;font-size:10px;background:var(--sig);color:var(--sig-ink);border-radius:999px;padding:0 4px;line-height:15px}
  .rail .lab{font-size:0;padding:10px 0 4px;border-top:1px solid var(--line);width:36px}
  .rs{width:44px;padding:0;justify-content:center}.rs .t{display:none}
  .srv{padding:8px;border-radius:10px}.srv>div:last-child,.srv .row span:last-child{display:none}
  .strip{padding:0 20px}.strip .core{width:64px;height:64px}.strip .core .bot{width:32px;height:30px}.strip .cap{left:104px;top:8px}
  .strip .nd b{display:none}
  .body{grid-template-columns:1fr}
  .body .side{display:none;position:absolute;right:0;top:0;bottom:0;width:320px;max-width:100%;box-shadow:-16px 0 40px rgba(0,0,0,.18);z-index:3}
  .body.drawer .side{display:grid}.body.drawer .drawer-x{display:grid}
  .ovb{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:16px 20px 20px;gap:14px}
  .ovb .col{display:none}.ovb .bar{display:flex}
  .rules,.cfg{grid-template-columns:1fr}
  .ph,.pb{padding-left:20px;padding-right:20px}
}
@media (max-width:760px){
  .fr{grid-template-columns:1fr}.two{grid-template-columns:1fr}.tr,.skr{grid-template-columns:28px 104px minmax(0,1fr) 96px}
  .tr .a span:last-child{display:none}.left{padding:12px}
}
</style>

function derive(){
 var rows=S.scan?S.scan.rows:[];
 var d={rows:rows,fix:[],ok:[],foreign:[],conflict:[],byKey:{},skillSet:{},ag:{},agents:[]};
 var order=(S.status&&S.status.targets||[]).map(function(t){return t.name;});
 var seen={};
 rows.forEach(function(r){
  d.byKey[key(r)]=r;seen[r.Target]=1;
  var a=d.ag[r.Target]||(d.ag[r.Target]={fix:0,warn:0,bad:0,ok:0,foreign:0,conflict:0});
  if(FIX[r.State]){d.fix.push(r);a.fix++;if(SEV[r.State]==='bad')a.bad++;else a.warn++;}
  else if(r.State==='OK'){d.ok.push(r);a.ok++;}
  else if(r.State==='FOREIGN'){d.foreign.push(r);a.foreign++;}
  else if(r.State==='CONFLICT'){d.conflict.push(r);a.conflict++;}
  if(r.State!=='FOREIGN')d.skillSet[r.Skill]=1;
 });
 d.agents=S.scan?order.filter(function(n){return seen[n];}):order.slice();
 Object.keys(seen).forEach(function(n){if(d.agents.indexOf(n)<0)d.agents.push(n);});
 d.nSkills=Object.keys(d.skillSet).length;
 return d;
}
function agSt(n){var a=D.ag[n];if(!a)return 'dim';return a.bad?'bad':(a.warn||a.conflict)?'warn':'ok';}

function tPath(n){var t=(S.status&&S.status.targets||[]).filter(function(x){return x.name===n;})[0];return t?t.path:(S.scan&&S.scan.targetPaths&&S.scan.targetPaths[n])||'';}

/* ---------- api ---------- */
function api(path,body){
 return fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Skillmesh-Token':TOKEN},body:JSON.stringify(body||{})}).then(function(r){
  return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e;}return j;},function(){var e=new Error('HTTP '+r.status);e.status=r.status;throw e;});
 },function(){var e=new Error('server unreachable');e.down=true;throw e;});
}
function fail(e,field){

 else if(field)S[field]=e.message;

}

}

function loadLink(){
 var ag=Object.keys(S.linkAgents).filter(function(k){return S.linkAgents[k];});
 if(!ag.length){S.link=null;render();return;}
 api('/api/link',{agents:ag,preview:true}).then(function(r){S.link=r.plan;S.linkErr=null;render();},function(e){fail(e,'linkErr');});
}

function doScan(target){

 if(location.hash!=='#scan')history.replaceState(null,'','#scan');

  S.scan=r;S.scanning=false;S.justDone={};S.agentFilter=target!=='all'&&target!=='both'&&r.targetPaths[target]?target:null;
  D=derive();S.ticks={};D.fix.forEach(function(x){S.ticks[key(x)]=true;});
  S.filter='fix';S.sel=D.fix.length?key(D.fix[0]):null;S.drawer=false;
  render();
 },function(e){S.scanning=false;if(e.status===400)loadStatus();fail(e,'err');});
}
function doApply(){
 var items=tickedRows().map(function(r){return {target:r.Target,skill:r.Skill};});
 if(!items.length||S.busy)return;
 S.busy=true;S.confirm=false;render();
 api('/api/apply',{scanId:S.scan.scanId,items:items}).then(function(r){
  S.busy=false;S.scan=r.scan;D=derive();
  S.justDone={};r.results.forEach(function(x){if(x.ok)S.justDone[x.target+'|'+x.skill]=x.state;});
  S.done={at:nowHm(),results:r.results};S.stale=null;S.err=null;
  var old=S.ticks;S.ticks={};D.fix.forEach(function(x){S.ticks[key(x)]=!!old[key(x)];});
  var firstDone=Object.keys(S.justDone)[0];S.sel=firstDone||(D.fix[0]?key(D.fix[0]):null);
  loadStatus();
 },function(e){S.busy=false;if(e.status===409){S.stale=e.message;S.done=null;render();}else fail(e,'err');});
}

 api('/api/link',{agents:ag}).then(function(r){S.busy=false;S.link=r.plan;S.linkMsg=r.lines;S.linkErr=null;render();},function(e){S.busy=false;fail(e,'linkErr');});
}

function copy(text){

 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,function(){legacy();});}else legacy();

  if(okA.length)h+='<div class="ln"><span class="ic ok">'+g('check',2.5)+'</span><b>'+okA.length+' agent folder'+(okA.length===1?'':'s')+' exist'+(okA.length===1?'s':'')+'</b><span class="sp"></span>'+okA.map(function(c){return lt(c.name.replace(/^target /,''),'sm');}).join('')+'</div>';
  badA.forEach(function(c){var n=c.name.replace(/^target /,'');h+='<div class="ln" data-st="background:var(--bad-soft)"><span class="ic bad">'+g('x',2.5)+'</span>'+lt(n,'sm')+'<b>'+esc(n)+'</b><span class="m">'+esc(sp(tPath(n)))+' does not exist</span><span class="sp"></span><button class="btn" data-act="copyText" data-k="'+esc(tPath(n))+'">'+g('copy')+'Copy path</button></div>';});
  h+='<div class="grp">This repository</div>';
  groups.repo.forEach(function(c){h+=c.ok?ck(c,esc(c.name)):'<div class="ln" data-st="background:var(--bad-soft)"><span class="ic bad">'+g('x',2.5)+'</span><b>'+esc(c.name)+'</b><span class="m">'+esc(c.detail)+'</span></div>';});
  body+='<section class="panel chk" data-st="overflow:hidden">'+h+'</section>';
 }
 return '<main id="main">'+ph('Doctor','Checks the config, every root and agent folder, and this repository\'s own files - read-only','<button class="btn pri" data-act="doctor" data-fk="doctor">'+g('doctor')+'Run Doctor</button>')+'<div class="pb">'+body+'</div></main>';
}

function linkPage(){
 var ags=['claude','kiro'],sel=ags.filter(function(a){return S.linkAgents[a];}),pk='';
 ags.forEach(function(a){pk+='<button class="agp" role="switch" aria-pressed="'+!!S.linkAgents[a]+'" data-act="linkAgent" data-k="'+a+'" data-fk="la|'+a+'">'+lt(a,'sm')+a+'<span class="tick">'+(S.linkAgents[a]?g('check',3):'')+'</span></button>';});
 var plan=S.link,todo=plan?plan.items.filter(function(i){return i.state==='WILL LINK'||i.state==='RELINK';}).length:0,names=[];
 if(plan)plan.items.forEach(function(i){if(names.indexOf(i.skill)<0)names.push(i.skill);});
 var tbl='';
 if(plan){
  tbl='<section class="panel" data-st="overflow:hidden"><div class="mr2 h" data-st="--cols:'+sel.length+'"><span>Project skill</span>'+sel.map(function(a){return '<span>'+lt(a,'sm')+'.'+a+'\\skills</span>';}).join('')+'</div>'+
   names.map(function(nm){return '<div class="mr2" data-st="--cols:'+sel.length+'"><b>'+esc(nm)+'</b>'+sel.map(function(a){var it=plan.items.filter(function(i){return i.skill===nm&&i.agent===a;})[0];if(!it)return '<span></span>';var c=it.state==='LINKED'?'ok':it.state==='WILL LINK'?'warn':it.state==='RELINK'?'warn':'bad';return '<span><span class="k s-'+c+'" title="'+esc(it.detail)+'">'+esc(it.state)+'</span></span>';}).join('')+'</div>';}).join('')+'</section>';
 } else if(!S.linkErr)tbl=banner('info','info',sel.length?'Loading the preview':'Pick at least one agent.');
 var hook=!plan?'':plan.hook==='present'?'Present in <code>.claude\\settings.json</code>; created only when absent.':plan.hook==='will create'?'Not in <code>.claude\\settings.json</code> yet; Link creates it.':'Only added when claude is selected.';
 var msg=S.linkMsg?'<section class="panel" data-st="padding:14px 18px"><div class="m" data-st="white-space:pre-wrap">'+esc(S.linkMsg.join('\n'))+'</div></section>':'';
 return '<main id="main">'+ph('Link','Links this repository\'s own skills into its gitignored agent folders - nothing outside this repository is touched')+'<div class="pb"><div class="agpick">'+pk+'<span class="sp"></span><button class="btn pri" data-act="link" data-fk="link"'+(sel.length&&!S.busy&&todo+(plan&&plan.hook==='will create'?1:0)?'':' disabled')+'>'+g('link')+(todo||(plan&&plan.hook==='will create')?'Link '+todo+' skill'+(todo===1?'':'s')+' in '+esc(sel.join(', ')):'Already linked')+'</button></div>'+
  (S.linkErr?banner('bad','alert',esc(S.linkErr)):'')+tbl+msg+
  '<div class="cards" data-st="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="cd"><h3><span class="ic ok">'+g('clock')+'</span>Session-start hook</h3><p>'+(hook||'Preview loads first.')+'</p></div><div class="cd"><h3><span class="ic">'+g('refresh')+'</span>Restart the agent after</h3><p>A running session does not see newly linked skills. A real folder in the way is skipped, never deleted.</p></div></div></div></main>';
}

function initPage(){
 var c=cfg(),st=S.status,body='';
 if(S.initErr)body+=banner('bad','alert',esc(S.initErr));
 if(S.initMsg)body+=banner('ok','check',esc(S.initMsg.join(' ')));
 if(!c)return '<main id="main">'+ph('Init','Creates skillmesh.config.json from the example when it is missing','<button class="btn pri" data-act="init" data-fk="init">'+g('init')+'Run Init</button>')+'<div class="pb">'+body+banner('info','info','<b>No skillmesh.config.json yet.</b> Init copies the example; then edit the file by hand and run Doctor.')+'</div></main>';
 body+=banner('info','info','<b>skillmesh.config.json exists.</b> Init would do nothing. Edit the file by hand, then run Doctor.','<button class="btn" data-act="copyText" data-k="'+esc(st.configPath)+'" data-fk="copyCfg">'+g('copy')+'Copy file path</button>');
 var roots=st.roots.map(function(r){return '<div class="ln"><span data-st="color:var(--mesh)">'+g('tree')+'</span><span class="m" data-st="color:var(--ink)">'+esc(sp(r))+'</span></div>';}).join('');
 var rules='<div class="ln"><span>ignore</span><span class="sp"></span><span class="pill s-dim">'+plural(st.ignore,'path')+'</span></div><div class="ln"><span>known_foreign</span><span class="sp"></span><span class="pill s-dim">'+plural(st.knownForeign,'name')+'</span></div><div class="ln"><span>overrides</span><span class="sp"></span><span class="pill s-dim">'+(st.overrides?st.overrides:'none')+'</span></div>';
 var tg=st.targets.map(function(t){return '<div class="ln">'+lt(t.name,'sm')+'<span>'+esc(t.name)+'</span><span class="sp"></span><span class="m">'+esc(sp(t.path))+'</span>'+(t.exists?'':'<span class="pill s-bad">missing</span>')+'</div>';}).join('');
 return '<main id="main">'+ph('Init','Creates skillmesh.config.json from the example when it is missing','<button class="btn pri" disabled>'+g('init')+'Run Init</button>')+'<div class="pb">'+body+'<div class="cfg"><section class="panel" data-st="overflow:hidden"><div class="oh"><h2>Roots</h2><span class="pill s-dim">'+st.roots.length+'</span></div>'+roots+'<div class="oh" data-st="border-top:1px solid var(--line)"><h2>Rules</h2></div>'+rules+'</section><section class="panel" data-st="overflow:hidden"><div class="oh"><h2>Agents (targets)</h2><span class="pill s-dim">'+st.targets.length+'</span></div>'+tg+'</section></div></div></main>';
}

function dialogs(){
 var h='';
 if(S.confirm){
  var t=tickedRows(),un=D.fix.length-t.length,groups=[],map={};
  t.forEach(function(r){var gk=r.State+'|'+r.Target;if(!map[gk]){map[gk]={state:r.State,target:r.Target,action:r.Action,skills:[]};groups.push(map[gk]);}map[gk].skills.push(r.Skill);});
  var copyT=t.filter(function(r){return r.State==='COPY';})[0];
  h+='<div class="scrim" data-scrim="1"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dh"><h2 id="dt">Apply '+(t.length===1?'1 fix':t.length+' fixes')+'?</h2><p>From the scan taken at '+esc(hm(S.scan.scannedAt))+'.'+(un?' '+un+' unticked row'+(un===1?'':'s')+' stay'+(un===1?'s':'')+' as '+(un===1?'it is':'they are')+'.':'')+'</p></div><div class="dl">'+
   groups.map(function(x){return '<div class="ln">'+kind({State:x.state})+'<b>'+esc(x.skills.join(', '))+'</b><span class="m">'+esc(ACTION[x.action]||x.action)+'</span>'+lt(x.target,'sm')+'</div>';}).join('')+'</div><div class="note"><div>'+g('shield')+'<span>No folder is deleted.'+(copyT?' The copy moves to '+esc(sp(S.scan.targetPaths[copyT.Target])+'\\'+S.status.trashDir)+'.':'')+'</span></div><div>'+g('lock')+'<span>If any folder changed since '+esc(hm(S.scan.scannedAt))+', nothing is applied and you are asked to scan again.</span></div></div>'+
   '<div class="df"><button class="btn" data-act="cancel" data-fk="cancel" data-autofocus="1">Cancel</button><button class="btn sig" data-act="doApply" data-fk="doApply">'+g('apply')+'Apply '+(t.length===1?'1 fix':t.length+' fixes')+'</button></div></div></div>';
 }
 if(S.down)h+='<div class="scrim top"><div class="dlg" role="alertdialog" aria-labelledby="sd" data-st="width:min(560px,100%)"><div class="dh"><h2 id="sd"><span class="ic bad" data-st="vertical-align:middle;margin-right:10px">'+g('plug')+'</span>Server stopped</h2><p>The page lost '+esc(location.host)+'. The rows below are the last scan and cannot be applied.</p></div><div class="note"><div><span data-st="color:var(--mesh)">'+g('term')+'</span><span>Start it again in the repository, then reload this page:<br><code>uv run scripts\\skillmesh_ui.py</code></span></div><div><span data-st="color:var(--mesh)">'+g('lock')+'</span>A new start makes a new token, so this tab must reload.</div></div><div class="df"><button class="btn" data-act="copyText" data-k="uv run scripts\\skillmesh_ui.py">'+g('copy')+'Copy command</button><button class="btn pri" data-act="reload">'+g('refresh')+'Reload</button></div></div></div>';
 if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
 return h;
}

/* ---------- render ---------- */
function render(){
 var app=$('#app');if(!app)return;
 var sc={};Array.prototype.forEach.call(app.querySelectorAll('[data-scroll]'),function(e){sc[e.getAttribute('data-scroll')]=e.scrollTop;});
 var mainTop=$('main',app)?$('main',app).scrollTop:0;
 var fk=document.activeElement&&document.activeElement.getAttribute?document.activeElement.getAttribute('data-fk'):null;
 D=derive();
 var page=S.page;
 if(S.status&&!cfg()&&['overview','doctor','init'].indexOf(page)<0)page=S.page='overview';
 var body;
 if(!S.status)body=loading();
 else body={overview:overview,scan:scanPage,log:logPage,safety:safetyPage,doctor:doctorPage,link:linkPage,init:initPage}[page]();
 app.className='app'+(S.down?' dead':'');
 app.innerHTML=rail()+body+dialogs();
 applyStyles(app);
 Array.prototype.forEach.call(app.querySelectorAll('[data-scroll]'),function(e){var v=sc[e.getAttribute('data-scroll')];if(v)e.scrollTop=v;});
 var m=$('main',app);if(m&&mainTop)m.scrollTop=mainTop;
 var f=null;if(fk){var els=app.querySelectorAll('[data-fk]');for(var i=0;i<els.length;i++)if(els[i].getAttribute('data-fk')===fk){f=els[i];break;}}
 if(!f&&S.confirm)f=$('[data-autofocus]',app);
 if(f)f.focus({preventScroll:true});
 layoutHub();fitStrips();
 var h1=$('main h1',app);document.title=(h1?h1.textContent+' - ':'')+'Skillmesh';
}
/* CSP forbids style attributes in markup; inline styles travel as data-st and are set through the CSSOM */
function applyStyles(root){Array.prototype.forEach.call((root||document).querySelectorAll('[data-st]'),function(e){e.style.cssText=e.getAttribute('data-st');});}
function fitStrips(){Array.prototype.forEach.call(document.querySelectorAll('.strip'),function(s){s.classList.remove('compact');var b=s.querySelector('.bus');if(b&&b.scrollWidth>b.clientWidth+2)s.classList.add('compact');});}

function route(){
 var h=location.hash.replace('#','');
 S.page=PAGES.indexOf(h)>=0?h:'overview';
 if(S.status&&!cfg()&&['overview','doctor','init'].indexOf(S.page)<0)S.page='overview';
 if(S.page==='log'){S.log=null;loadLog();}
 if(S.page==='link')loadLink();
 if(S.page==='safety'||S.page==='init')loadStatus();
 render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-act]'):null;
 if(!t){var tr=e.target.closest?e.target.closest('.tr[data-k]'):null;if(tr){select(tr.getAttribute('data-k'));}return;}
 if(t.disabled)return;
 var a=t.getAttribute('data-act'),k=t.getAttribute('data-k');
 switch(a){
  case 'scan':doScan('all');break;
  case 'scan1':doScan(k);break;
  case 'scanAgain':doScan(S.scan?S.scan.target:'all');break;
  case 'go':location.hash='#'+k;break;
  case 'review':S.filter='fix';S.agentFilter=null;location.hash='#scan';break;
  case 'agent':S.agentFilter=k;S.filter=agNeed(k)?'fix':'ok';S.view='table';
   var first=D.rows.filter(function(r){return r.Target===k&&FIX[r.State];})[0];S.sel=first?key(first):S.sel;
   if(S.page!=='scan')location.hash='#scan';else render();break;
  case 'clearAgent':S.agentFilter=null;render();break;
  case 'filter':S.filter=k;if(S.page!=='scan')location.hash='#scan';else render();break;
  case 'view':S.view=k;render();break;
  case 'sel':select(k);break;
  case 'tick':S.ticks[k]=!S.ticks[k];render();break;
  case 'tickSel':if(S.sel){S.ticks[S.sel]=!S.ticks[S.sel];render();}break;
  case 'tickAll':D.fix.forEach(function(r){S.ticks[key(r)]=true;});render();break;
  case 'tickNone':S.ticks={};render();break;
  case 'apply':if(tickedRows().length){S.confirm=true;render();}break;
  case 'cancel':S.confirm=false;render();break;
  case 'doApply':doApply();break;
  case 'closeDrawer':S.drawer=false;render();break;
  case 'dismiss':S.err=null;render();break;
  case 'hash':S.noHash=!S.noHash;render();break;
  case 'mxAll':S.mxAll=!S.mxAll;render();break;
  case 'doctor':doDoctor();break;
  case 'linkAgent':S.linkAgents[k]=!S.linkAgents[k];S.linkMsg=null;loadLink();break;
  case 'link':doLink();break;
  case 'init':doInit();break;
  case 'selRun':S.selRun=+k;render();break;
  case 'copyLog':var run=S.log&&S.log.runs.filter(function(x){return x.id===S.selRun;})[0];if(run)copy(run.lines.join('\n'));break;
  case 'copyPaths':var r=S.sel&&D.byKey[S.sel];if(r){var src=S.scan.sources[r.Skill];copy((src?src+'\n':'')+S.scan.targetPaths[r.Target]+'\\'+r.Skill);}break;
  case 'copyText':copy(k);break;
  case 'reload':location.reload();break;
 }
});
function select(k){S.sel=k;S.drawer=true;render();}
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(S.confirm){S.confirm=false;render();}else if(S.drawer){S.drawer=false;render();}return;}
 if((e.key==='s'||e.key==='S')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!S.confirm){var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;e.preventDefault();doScan('all');}
});
window.addEventListener('hashchange',route);
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){layoutHub();fitStrips();},80);});
setInterval(function(){if(S.down||S.busy||S.scanning)return;api('/api/status').then(function(r){S.status=r;},function(e){if(e.down){S.down=true;render();}});},10000);

/* ---------- start ---------- */
api('/api/status').then(function(r){S.status=r;route();if(r.config)loadLink();},function(e){S.status={config:false,targets:[],roots:[]};S.down=!!e.down;route();});
})();
</script>
</body>
