<!-- Signature (Skillmesh, mesh hub):
 1 concept: a mesh of agents around one bot head; a skill repo is edited once and every agent node sees it.
 2 shape: circles as nodes joined by thin connecting lines, one outline bot head with a dotted halo, dot-grid ground.
 3 typeface: Oxanium 800 (names, headings), Share Tech Mono (labels, text).
 4 palette: cool white and ink teal in light, deep teal-black in dark; cyan links, one coral signal (antenna, travelling pulse).
 5 presentation: centred hub poster; figures reuse the nodes, the links and the bot head; labels short and in the tool's own words.
 6 not: no hardware panel, no transit map, no stamps, no blue-purple gradient, no official agent logos (marks are simple stand-ins).
 Fonts seen by render.py: Oxanium, Share Tech Mono. Grounds: light rgb(242,248,250), dark rgb(7,23,32). -->
